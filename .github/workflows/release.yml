# SPDX-FileCopyrightText: 2026 Corvane contributors
#
# Push a tag named <game>-v<version> (e.g. corvane-v0.1.0) to build that game's
# folder in its pinned BlocksDS container (games/<game>/build.sh release) and upload
# the ROMs as workflow artifacts:
#   <tag>        build/release/rom   (main ROM, variants, licence texts, SHA256SUMS)
#   <tag>-demos  build/release/demos (optional, same layout)
#   <tag>-judge  build/release/judge (optional: emulator-test kit with the rehearsal
#                ROMs, expected.json and judge.py; corvane's has no ROMs, it grades the demos)
# The release job then zips each artifact and attaches the zips to a GitHub
# Release named after the tag, so the ROMs outlive the artifact retention.
# Only that job gets write access; the build job stays read-only.

name: Release build

on:
  push:
    tags: ['*-v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      game: ${{ steps.tag.outputs.game }}
    steps:
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9_-]*-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not <game>-v<major>.<minor>.<patch> (e.g. corvane-v0.1.0)"
            exit 1
          fi
          echo "game=${TAG%-v[0-9]*}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Releases come from main only (develop is merged into main by a release PR).
      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge the release PR first, then tag main."
            exit 1
          fi

      - name: Check game folder
        env:
          GAME: ${{ steps.tag.outputs.game }}
        run: |
          if [ ! -x "games/$GAME/build.sh" ] || ! grep -q '^release:' "games/$GAME/Makefile"; then
            echo "::error::No game folder 'games/$GAME/' with build.sh and a 'release' make target"
            exit 1
          fi

      - name: Build
        working-directory: games/${{ steps.tag.outputs.game }}
        run: ./build.sh -j"$(nproc)" release

      - name: Checksums
        working-directory: games/${{ steps.tag.outputs.game }}/build/release
        run: |
          for d in rom demos judge; do
            [ -d "$d" ] || continue
            # a kit without ROMs (corvane judge: expected.json + judge.py) has nothing to sum
            (cd "$d" && if ls -- *.nds >/dev/null 2>&1; then sha256sum -- *.nds > SHA256SUMS && cat SHA256SUMS; fi)
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref_name }}
          path: games/${{ steps.tag.outputs.game }}/build/release/rom/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref_name }}-demos
          path: games/${{ steps.tag.outputs.game }}/build/release/demos/
          if-no-files-found: ignore

      # Games that grade themselves (lightenette, elevane) ship the rehearsal ROMs with
      # expected.json and judge.py (corvane: expected.json and judge.py only).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref_name }}-judge
          path: games/${{ steps.tag.outputs.game }}/build/release/judge/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ github.ref_name }}*
          path: dist

      # One zip per artifact keeps every ROM next to the licence texts it must carry.
      - name: Package
        working-directory: dist
        run: |
          for d in */; do
            d="${d%/}"
            (cd "$d" && zip -qr -X "../$d.zip" .)
          done
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GAME: ${{ needs.build.outputs.game }}
        run: |
          # A tag pushed at the wrong commit and then moved starts one run per
          # push, queued in order. The run for the old commit must not publish
          # (corvane-v0.2.1 first went out with v0.2.0 notes this way).
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG now points at $tagged, but this run built $GITHUB_SHA. Not publishing; the run for the moved tag does."
            exit 1
          fi
          version="${TAG#"$GAME"-}"
          case "$version" in *-*) pre=--prerelease ;; *) pre= ;; esac
          {
            echo "$GAME $version, built by [this workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`."
            echo
            echo "- \`$TAG.zip\`: game ROM and save-chip variants"
            if [ -f "$TAG-demos.zip" ]; then echo "- \`$TAG-demos.zip\`: feature demo ROMs"; fi
            if [ -f "$TAG-judge.zip" ]; then echo "- \`$TAG-judge.zip\`: emulator-test kit (rehearsal ROMs, \`expected.json\`, \`judge.py\`)"; fi
            echo
            echo "Each zip has its own \`SHA256SUMS\` and the licence texts and third-party notices."
            echo "The build is reproducible: \`./build.sh release\` in \`games/$GAME/\` at this commit gives the same ROMs."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run: replace the files and the notes, which list their checksums.
            gh release upload --clobber "$TAG" -- *.zip SHA256SUMS
            gh release edit "$TAG" --notes-file notes.md
          else
            # shellcheck disable=SC2086 # $pre is empty or one flag
            gh release create "$TAG" --verify-tag --title "$GAME $version" \
              --notes-file notes.md $pre -- *.zip SHA256SUMS
          fi
